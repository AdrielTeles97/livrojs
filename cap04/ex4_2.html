<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 - CAP 04</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="shortcut icon" href="./img/livrojs.png" type="image/x-icon">
</head>
<body>
    <img src="./img/ex4_2.jpg" alt="Balança de peso">
    <h1>Programa Cálculo do peso ideal</h1>
    <form>
        <p>
            Nome:
            <input type="text" id="inNome" required>
        </p>
        <p>
            Sexo:
            <input type="radio" name="sexo" id="inMasculino"> Masculino
            <input type="radio" name="sexo" id="inFeminino"> Feminino
        </p>
        <p>
            Altura:
            <input type="number" id="inAltura" min="0" step="0.01" required>
        </p>
        <input type="submit" value="Calcular peso ideal">
        <input type="reset" value="Limpar campos">
    </form>
    <h3></h3>
    <script src="./js/ex4_2.js"></script>
    
</body>
</html>
