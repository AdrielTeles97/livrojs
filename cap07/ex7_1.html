<body>
    <script>
        const anuncio = prompt("Digite o anuncio: ")
        let contadorPalavra = 0
        const tamanhoPalavra = anuncio.length

        for (const letra of anuncio) {
            if (letra == " ") {
                contadorPalavra++
            }
        }
        
        alert(`Anúncio: ${anuncio}\n Quantidade de palavras: ${contadorPalavra + 1}`)
    </script>
    
</body>
