<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex10 - 02</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-5">
                <img src="./img/ex10_2.jpg" alt="Moedas" class="img-fluid">
            </div>
            <div class="col-sm-7" id="divMoedas">
                <form>
                    <h1>Vamos brincar de dinheiro ?</h1>
                    <p>
                        <label for="inSoma">A soma das moedas exibidas abaixo é:</label>
                        <input type="number" min="0" step="0.05" class="form-control" id="inSoma" required autofocus>
                    </p>
                    <p>
                        <input type="submit" class="btn btn-primary" value="Conferir respostas">
                        <input type="reset" class="btn btn-danger" value="Exibir novas Moedas">
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="./js/ex10.2.js"></script>
</body>
</html>
