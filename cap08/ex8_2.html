<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX 08 - Exercício 2</title>
    <link rel="shortcut icon" href="./img/livrojs.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <img src="./img/ex8_2.jpg" alt="Revenda Avenida" class="normal">
    <h1>Revenda avenida - Promoção</h1>
    <form>
        <p>
            Modelo do veiculo:
            <input type="text" id="inModelo" required autofocus>
        </p>
        <p>
            Ano de fabricação:
            <input type="number" id="inAno" required>
        </p>
        <p>
            Preço R$:
            <input type="number" id="inPreco" min="0" step="0.01" required>
        </p>
        <input type="submit" value="Classificar - Calcular entrada e parcelas">
    </form>
    <h3 id="outResp1"></h3>
    <h3 id="outResp2"></h3>
    <h3 id="outResp3"></h3>
    <script src="./js/ex8_2.js"></script>
</body>
</html>
