<meta charset="UTF-8">
<script>
    //Cácula média baseado em duas notas
    const firstNote = Number(prompt("Digite a primeira nota"));
    const secondNote = Number(prompt("Digite a segunda nota"));
    const average = (firstNote + secondNote) / 2;

    alert(`1º Nota: ${firstNote.toFixed(1)}\n 2º Nota: ${secondNote.toFixed(1)}\n Média: ${average.toFixed(1)}`);
</script>
