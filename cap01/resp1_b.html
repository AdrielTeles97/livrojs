<meta charset="UTF-8">
<script>
    const paidInFull = Number(prompt("Valor total a pagar"));
    const divisionByCustomers = Number(prompt("Digite o número de clientes"));
    const valuePerCustomers = paidInFull / divisionByCustomers;
    
    alert(`Valor da conta: R$: ${paidInFull.toFixed(2)}\n Número de clientes: ${divisionByCustomers}\n Valor por clientes R$: ${valuePerCustomers.toFixed(2)} `);
</script>
