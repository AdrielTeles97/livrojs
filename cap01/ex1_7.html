<meta charset="UTF-8">
<script>
    const valorJantar = Number(prompt("Digite o valor do jantar"));
    const garcom = valorJantar * 0.10 // Cálcula 10%
    
    alert(`Valor do jantar R$: ${valorJantar.toFixed(2)}\n Taxa do garçom(10%): R$ ${garcom.toFixed(2)}\n Total a pagar R$ ${(valorJantar + garcom).toFixed(2)}`);

    console.log(typeof garcom);
    console.log(typeof valorJantar);
    
</script>
